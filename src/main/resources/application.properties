spring.application.name=notification-service

server.port=8085

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:payment_user}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:payment_pass}

notification.messaging.exchange=payment.events
notification.messaging.payment-status-changed-routing-key=payment.status.changed
notification.messaging.payment-status-changed-queue=notification.payment.status.changed

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
